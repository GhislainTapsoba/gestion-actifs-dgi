<div class="auth-shell">
  <div class="auth-card">
    <!-- Branding DGI -->
    <div class="auth-brand">
      <div class="auth-brand__mark">
        <fa-icon icon="shield-alt" />
      </div>
      <div>
        <h2 class="auth-brand__title">DGI</h2>
        <p class="auth-brand__subtitle">Gestion des Actifs Informatiques</p>
      </div>
    </div>

    <h1 data-cy="loginTitle">Connexion</h1>

    @if (authenticationError()) {
      <div class="alert alert-danger" data-cy="loginError">
        <strong>Identifiants incorrects</strong> — Veuillez vérifier votre nom d'utilisateur et mot de passe.
      </div>
    }

    <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
      <div class="mb-3">
        <label class="form-label" for="username">Nom d&apos;utilisateur</label>
        <input
          type="text"
          #username
          class="form-control"
          name="username"
          id="username"
          placeholder="Votre identifiant"
          formControlName="username"
          data-cy="username"
          autocomplete="username"
        />
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Mot de passe</label>
        <input
          type="password"
          class="form-control"
          name="password"
          id="password"
          placeholder="Votre mot de passe"
          formControlName="password"
          data-cy="password"
          autocomplete="current-password"
        />
      </div>

      <div class="form-check">
        <label class="form-check-label" for="rememberMe">
          <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
          <span>Garder la session ouverte</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary" data-cy="submit">Se connecter</button>
    </form>

    <div class="auth-footer-links">
      <a routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector">Mot de passe oublié ?</a>
    </div>
  </div>
</div>
