<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (categorieMateriel(); as categorieMaterielRef) {
      <div>
        <h2 data-cy="categorieMaterielDetailsHeading">
          <span jhiTranslate="gestionActifsDgiApp.categorieMateriel.detail.title">Categorie Materiel</span>
        </h2>

        <hr />

        <jhi-alert-error />

        <jhi-alert />

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ categorieMaterielRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="gestionActifsDgiApp.categorieMateriel.libelle">Libelle</span></dt>
          <dd>
            <span>{{ categorieMaterielRef.libelle }}</span>
          </dd>
          <dt><span jhiTranslate="gestionActifsDgiApp.categorieMateriel.description">Description</span></dt>
          <dd>
            <span>{{ categorieMaterielRef.description }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left" />&nbsp;<span jhiTranslate="entity.action.back">Retour</span>
        </button>

        <button type="button" [routerLink]="['/categorie-materiel', categorieMaterielRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt" />&nbsp;<span jhiTranslate="entity.action.edit">Editer</span>
        </button>
      </div>
    }
  </div>
</div>
