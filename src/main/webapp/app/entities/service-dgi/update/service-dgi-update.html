<div class="d-flex justify-content-center">
  <div class="col-8">
    <form name="editForm" novalidate (ngSubmit)="save()" [formGroup]="editForm">
      <h2
        id="jhi-service-dgi-heading"
        data-cy="ServiceDgiCreateUpdateHeading"
        jhiTranslate="gestionActifsDgiApp.serviceDgi.home.createOrEditLabel"
      >
        Créer ou éditer un Service Dgi
      </h2>

      <div>
        <jhi-alert-error />

        @if (editForm.controls.id.value !== null) {
          <div class="mb-3">
            <label class="form-label" for="field_id" jhiTranslate="global.field.id">ID</label>
            <input type="number" class="form-control" name="id" id="field_id" data-cy="id" formControlName="id" [readonly]="true" />
          </div>
        }

        @let nomServiceRef = editForm.get('nomService')!;
        <div class="mb-3">
          <label class="form-label" for="field_nomService" jhiTranslate="gestionActifsDgiApp.serviceDgi.nomService">Nom Service</label>
          <input
            type="text"
            class="form-control"
            name="nomService"
            id="field_nomService"
            data-cy="nomService"
            formControlName="nomService"
          />
          @if (nomServiceRef.invalid && (nomServiceRef.dirty || nomServiceRef.touched)) {
            <div>
              @if (nomServiceRef.errors?.required) {
                <small class="form-text text-danger" jhiTranslate="entity.validation.required">Ce champ est obligatoire.</small>
              }
            </div>
          }
        </div>

        <div class="mb-3">
          <label class="form-label" for="field_chefService" jhiTranslate="gestionActifsDgiApp.serviceDgi.chefService">Chef Service</label>
          <input
            type="text"
            class="form-control"
            name="chefService"
            id="field_chefService"
            data-cy="chefService"
            formControlName="chefService"
          />
        </div>
      </div>

      <div>
        <button type="button" id="cancel-save" data-cy="entityCreateCancelButton" class="btn btn-secondary" (click)="previousState()">
          <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Annuler</span>
        </button>

        <button
          type="submit"
          id="save-entity"
          data-cy="entityCreateSaveButton"
          [disabled]="editForm.invalid || isSaving()"
          class="btn btn-primary"
        >
          <fa-icon icon="save" />&nbsp;<span jhiTranslate="entity.action.save">Sauvegarder</span>
        </button>
      </div>
    </form>
  </div>
</div>
